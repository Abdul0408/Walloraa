<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallpaper Preview — Walloraa 4K</title>
  <meta id="metaDesc" name="description" content="Download free ultra-high-definition 4K & 8K OLED wallpapers on Walloraa. Zero watermarks, CC0 open-source." />
  <link id="canonicalLink" rel="canonical" href="https://walloraa.vercel.app/wallpaper.html" />

  <!-- Open Graph / Social Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Walloraa 4K" />
  <meta id="ogTitle" property="og:title" content="Wallpaper Preview — Walloraa 4K" />
  <meta id="ogDesc" property="og:description" content="Download free ultra-sharp 4K & 8K wallpapers for mobile and desktop." />
  <meta id="ogImage" property="og:image" content="" />
  <meta name="twitter:card" content="summary_large_image" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen antialiased">

  <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-16">
    <div class="mb-4">
      <a href="explore.html" class="inline-flex items-center gap-2 font-mono-tech text-xs text-slate-400 hover:text-cyan-300 transition">
        ← BACK TO ARCHIVE
      </a>
    </div>

    <!-- MAIN STAGE -->
    <div class="hud-card rounded-3xl overflow-hidden grid grid-cols-1 lg:grid-cols-12">
      <!-- Interactive Device Stage -->
      <div class="lg:col-span-8 bg-[#040508] relative flex flex-col items-center justify-center min-h-[420px] sm:min-h-[600px] p-5 sm:p-8 overflow-hidden">
        <div id="ambientGlow" class="absolute inset-0 opacity-25 blur-3xl pointer-events-none"></div>

        <!-- Mode Switcher -->
        <div class="relative z-20 flex items-center gap-1.5 bg-white/[0.06] backdrop-blur-md p-1 rounded-full border border-white/10 mb-6">
          <button onclick="setMode('raw')" id="btnRaw" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-cyan-400 text-black transition cursor-pointer">Full Art</button>
          <button onclick="setMode('phone')" id="btnPhone" class="px-4 py-1.5 rounded-full text-xs font-semibold text-slate-300 hover:text-white transition cursor-pointer">Phone Lockscreen</button>
          <button onclick="setMode('desktop')" id="btnDesktop" class="px-4 py-1.5 rounded-full text-xs font-semibold text-slate-300 hover:text-white transition cursor-pointer">Desktop Monitor</button>
        </div>

        <div id="viewRaw" class="relative z-10 flex items-center justify-center w-full">
          <img id="imgRaw" src="" alt="" class="max-h-[66vh] w-auto object-contain rounded-2xl shadow-2xl border border-white/10" />
        </div>

        <div id="viewPhone" class="hidden relative z-10 w-[245px] h-[495px] rounded-[40px] border-[6px] border-slate-800 bg-black shadow-2xl overflow-hidden">
          <div class="absolute top-2.5 left-1/2 -translate-x-1/2 w-20 h-5 bg-black rounded-full z-20"></div>
          <img id="imgPhone" src="" alt="" class="w-full h-full object-cover" />
          <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/50 z-10 flex flex-col justify-between p-5 text-center">
            <div class="pt-7">
              <p class="font-mono-tech text-[10px] text-white/80">LOCKED // OLED PREVIEW</p>
              <p class="font-display font-bold text-5xl text-white mt-1">09:41</p>
            </div>
            <div class="w-24 h-1 bg-white/80 rounded-full mx-auto"></div>
          </div>
        </div>

        <div id="viewDesktop" class="hidden relative z-10 w-full max-w-2xl">
          <div class="rounded-2xl border-[6px] border-slate-800 bg-black overflow-hidden shadow-2xl aspect-video relative">
            <img id="imgDesktop" src="" alt="" class="w-full h-full object-cover" />
            <div class="absolute bottom-3 left-1/2 -translate-x-1/2 px-4 py-1.5 rounded-2xl bg-white/15 backdrop-blur-xl border border-white/20 flex items-center gap-2.5">
              <span class="w-5 h-5 rounded-md bg-cyan-400"></span>
              <span class="w-5 h-5 rounded-md bg-violet-500"></span>
              <span class="w-5 h-5 rounded-md bg-fuchsia-500"></span>
              <span class="w-5 h-5 rounded-md bg-emerald-400"></span>
            </div>
          </div>
          <div class="w-24 h-5 bg-slate-800 mx-auto rounded-b-lg"></div>
        </div>
      </div>

      <!-- Telemetry & Download Sidebar -->
      <div class="lg:col-span-4 p-6 sm:p-8 flex flex-col justify-between border-t lg:border-t-0 lg:border-l border-white/10 bg-[#080a12]/90">
        <div>
          <a id="wpCatLink" href="explore.html" class="inline-block font-mono-tech text-xs uppercase tracking-widest text-cyan-300 bg-cyan-500/10 border border-cyan-500/30 px-3 py-1 rounded-full"></a>
          <h1 id="wpTitle" class="font-display font-bold text-2xl sm:text-3xl text-white mt-4 leading-tight">Loading...</h1>
          <p class="font-mono-tech text-[11px] text-slate-400 mt-1.5">SOURCE: WALLORAA STUDIO • CC0 FREE</p>

          <div class="mt-6">
            <span class="font-mono-tech text-[10px] uppercase text-slate-400 block mb-2">EXTRACTED PALETTE (CLICK TO COPY)</span>
            <div id="wpColors" class="flex flex-wrap gap-2"></div>
          </div>

          <div class="mt-6 bg-white/[0.03] rounded-2xl p-4 border border-white/10 space-y-3 text-xs">
            <div class="flex justify-between">
              <span class="text-slate-400">Resolution</span>
              <span id="wpRes" class="font-mono-tech font-bold text-cyan-300"></span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-400">Total Downloads</span>
              <span id="wpDownloads" class="font-mono-tech font-bold text-white"></span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-400">Usage Rights</span>
              <span class="font-mono-tech text-emerald-400">Personal & Commercial</span>
            </div>
          </div>

          <div class="mt-6">
            <span class="font-mono-tech text-[10px] uppercase text-slate-400 block mb-2">NEURAL TAGS</span>
            <div id="wpTags" class="flex flex-wrap gap-1.5"></div>
          </div>
        </div>

        <div class="pt-6 mt-8 border-t border-white/10 space-y-2.5">
          <button id="downloadBtn" class="w-full btn-cyber py-3.5 px-5 rounded-2xl font-bold text-sm text-white flex items-center justify-center gap-2 shadow-xl cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Download Original 4K
          </button>
          <button onclick="copyShareUrl()" class="w-full bg-white/[0.05] hover:bg-white/[0.1] border border-white/10 text-slate-200 font-semibold py-2.5 px-4 rounded-xl text-xs transition cursor-pointer">
            Copy Direct Share Link
          </button>
        </div>
      </div>
    </div>

    <!-- RELATED WALLPAPERS -->
    <section class="mt-14">
      <h2 class="font-display font-bold text-xl text-white mb-5">Related 4K Visuals</h2>
      <div id="relatedGrid" class="masonry-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    renderShell('explore');

    function setMode(mode) {
      document.getElementById('viewRaw').classList.toggle('hidden', mode !== 'raw');
      document.getElementById('viewPhone').classList.toggle('hidden', mode !== 'phone');
      document.getElementById('viewDesktop').classList.toggle('hidden', mode !== 'desktop');

      const btns = { raw: 'btnRaw', phone: 'btnPhone', desktop: 'btnDesktop' };
      Object.entries(btns).forEach(([k, id]) => {
        document.getElementById(id).className = k === mode
          ? 'px-4 py-1.5 rounded-full text-xs font-semibold bg-cyan-400 text-black transition cursor-pointer'
          : 'px-4 py-1.5 rounded-full text-xs font-semibold text-slate-300 hover:text-white transition cursor-pointer';
      });
    }

    function copyShareUrl() {
      navigator.clipboard?.writeText(window.location.href);
      showToast('Wallpaper link copied!');
    }

    function copyHex(hex) {
      navigator.clipboard?.writeText(hex);
      showToast(`Copied ${hex}`);
    }

    function updateDynamicSEO(item, tags) {
      const pageTitle = `${item.title} (${item.resolution || '4K UHD'}) — Free ${item.category} Wallpaper | Walloraa`;
      const desc = `Download ${item.title} in ${item.resolution || '4K UHD'} ultra-sharp resolution for mobile and desktop. Free ${item.category} wallpaper (${tags.slice(0, 5).join(', ')}) with zero watermarks on Walloraa.`;
      const canonicalUrl = `https://walloraa.vercel.app/wallpaper.html?id=${encodeURIComponent(item.id)}`;

      document.title = pageTitle;
      document.getElementById('metaDesc')?.setAttribute('content', desc);
      document.getElementById('canonicalLink')?.setAttribute('href', canonicalUrl);
      document.getElementById('ogTitle')?.setAttribute('content', pageTitle);
      document.getElementById('ogDesc')?.setAttribute('content', desc);
      document.getElementById('ogImage')?.setAttribute('content', item.image_url);

      // Inject Google ImageObject Structured Data (JSON-LD)
      const schemaScript = document.createElement('script');
      schemaScript.type = 'application/ld+json';
      schemaScript.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "ImageObject",
        "name": item.title,
        "description": desc,
        "contentUrl": item.image_url,
        "acquireLicensePage": canonicalUrl,
        "license": "https://creativecommons.org/publicdomain/zero/1.0/",
        "creditText": "Walloraa 4K Archive",
        "keywords": tags.join(", ")
      });
      document.head.appendChild(schemaScript);
    }

    (async function initDetail() {
      const list = await loadWalloraaData();
      const id = new URLSearchParams(window.location.search).get('id');
      const item = list.find(w => String(w.id) === String(id)) || list[0];
      if (!item) return;

      const colors = Array.isArray(item.colors) ? item.colors : ['#00f0ff', '#a855f7', '#ec4899'];
      const tags = Array.isArray(item.tags) ? item.tags : ['4k', 'walloraa'];

      updateDynamicSEO(item, tags);

      const altText = `${item.title} ${item.resolution || '4K'} ${item.category} Wallpaper`;
      ['imgRaw', 'imgPhone', 'imgDesktop'].forEach(imgId => {
        const el = document.getElementById(imgId);
        el.src = item.image_url;
        el.alt = altText;
      });
      document.getElementById('ambientGlow').style.background = `radial-gradient(circle, ${colors[0]}, transparent 70%)`;

      const catLink = document.getElementById('wpCatLink');
      catLink.textContent = item.category;
      catLink.href = `explore.html?cat=${encodeURIComponent(item.category)}`;

      document.getElementById('wpTitle').textContent = item.title;
      document.getElementById('wpRes').textContent = item.resolution || '4K UHD';
      document.getElementById('wpDownloads').textContent = (item.downloads || 0).toLocaleString();

      document.getElementById('wpColors').innerHTML = colors.map(hex => `
        <button onclick="copyHex('${hex}')" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-white/[0.05] hover:bg-white/[0.12] border border-white/10 transition cursor-pointer">
          <span class="w-3.5 h-3.5 rounded-full border border-white/20" style="background:${hex}"></span>
          <span class="font-mono-tech text-[11px] text-slate-300">${hex}</span>
        </button>
      `).join('');

      document.getElementById('wpTags').innerHTML = tags.map(t => `
        <a href="explore.html?q=${encodeURIComponent(t)}" class="font-mono-tech text-[11px] bg-white/[0.05] hover:border-cyan-400/50 text-slate-300 px-2.5 py-1 rounded-full border border-white/10 transition">#${t}</a>
      `).join('');

      document.getElementById('downloadBtn').onclick = () => {
        triggerDownload(item.id);
        document.getElementById('wpDownloads').textContent = (item.downloads || 0).toLocaleString();
      };

      const related = list.filter(w => w.category === item.category && String(w.id) !== String(item.id)).slice(0, 6);
      const fallback = related.length ? related : list.filter(w => String(w.id) !== String(item.id)).slice(0, 6);
      document.getElementById('relatedGrid').innerHTML = fallback.map(createWallpaperCardHTML).join('');
    })();
  </script>
</body>
</html>
